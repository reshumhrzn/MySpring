<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery Cloudinary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
          integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:insert="navbar.html"></div>


<div class="page-container">
    <h1>This is cloudinary gallery page!</h1>
    <hr>
    <form method="POST" action="gallery2" enctype="multipart/form-data" class="d-flex align-items-center gap-2 mb-3">
        <input type="file" name="image" class="form-control" style="max-width: 320px;">
        <input type="submit" value="Upload Image" class="btn btn-accent">
    </form>
    <hr>
    <h4>Images from Cloudinary:</h4>
    <span th:each="image:${cloudImages}">
        <img th:src="${image.getImageUrl()}" width="200" height="200" class="rounded shadow-sm m-1">
    </span>
</div>

</body>
</html>
