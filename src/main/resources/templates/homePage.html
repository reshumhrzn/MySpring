<!DOCTYPE html>
<html lang="en">
<head th:replace="fragments/head :: head('Home Page')"></head>
<body>

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="page-container">
    <h1>Welcome home!!</h1>
    <hr>

    <table class="table table-hover">
        <tr>
            <td>ID</td>
            <td>User Name</td>
            <td>Edit Username</td>
            <td>Delete User</td>
        </tr>
        <tr th:each="user:${totalUsers}">
            <td th:text="${user.getId()}"></td>
            <td th:text="${user.getUsername()}"></td>
            <td>
                <form method="POST" action="editUser">
                    <input type="hidden" name="id" th:value="${user.getId()}">
                    <input type="submit" class="btn btn-sm btn-outline-primary" value="Edit this username">
                </form>
            </td>
            <td>
                <form method="POST" action="deleteUser">
                    <input type="hidden" th:value="${user.getId()}" name="id">
                    <input type="submit" class="btn btn-sm btn-outline-danger" value="Delete">
                </form>
            </td>
        </tr>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
