<!DOCTYPE html>
<html lang="en">
<head th:replace="fragments/head :: head('Login Page')"></head>
<body>
<div class="auth-wrapper">
    <div class="card">
        <div class="card-header">
            <h3>Sign In</h3>
            <div class="d-flex justify-content-end social_icon">
                <span><i class="fab fa-facebook-square"></i></span>
                <span><i class="fab fa-google-plus-square"></i></span>
                <span><i class="fab fa-twitter-square"></i></span>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${signupSuccess}" class="alert alert-success py-2" th:text="${signupSuccess}"></div>
            <div th:if="${LoginError}" class="alert alert-danger py-2">
                <i class="fas fa-exclamation-triangle"></i>
                <span th:text="${LoginError}"></span>
            </div>
            <div th:if="${message}" class="alert alert-info py-2" th:text="${message}"></div>

            <form method="POST" action="loginPost">
                <div class="input-group form-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                    </div>
                    <input type="text" class="form-control" placeholder="username" name="username">
                </div>
                <div class="input-group form-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                    </div>
                    <input type="password" class="form-control" placeholder="password" name="password">
                </div>
                <div class="row align-items-center remember">
                    <input type="checkbox">Remember Me
                </div>
                <div class="form-group">
                    <input type="submit" value="Login" class="btn float-end login_btn">
                </div>
            </form>
        </div>
        <div class="card-footer">
            <div class="d-flex justify-content-center links">
                Don't have an account?<a href="signup">Sign Up</a>
            </div>
        </div>
    </div>
</div>


</body>
</html>
