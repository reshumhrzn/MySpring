<!DOCTYPE html>
<html lang="en">
<head th:replace="fragments/head :: head('Edit a user')"></head>
<body>

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="page-container">
    <h1>Edit the following user:</h1>
    <br>
    <form method="POST" action="updateUser" class="w-50">
        <div class="mb-3">
            <label class="form-label">Id</label>
            <input type="text" class="form-control" th:value="${user.getId()}" name="id" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" th:value="${user.getUsername()}" name="username">
        </div>
        <input type="hidden" th:value="${user.getPassword()}" name="password">
        <input type="submit" value="Update this user!" class="btn btn-accent">
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
