<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit a user</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
          integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:insert="navbar.html"></div>


<div class="page-container">
    <h1>Edit the following user:</h1>
    <br>
    <form method="POST" action="updateUser" class="w-50">
        <div class="mb-3">
            <label class="form-label">Id</label>
            <input type="text" class="form-control" th:value="${user.getId()}" name="id" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" th:value="${user.getUsername()}" name="username">
        </div>
        <input type="hidden" th:value="${user.getPassword()}" name="password">
        <input type="submit" value="Update this user!" class="btn btn-accent">
    </form>
</div>

</body>
</html>
